version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SENTINEL_LOG_DIR: /app/logs
      SENTINEL_RULES_FILE: /app/src/sentinellog/rules/rules.yaml
      DATABASE_URL: postgresql://sentinel:password@db:5432/sentinel
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - kafka
    restart: unless-stopped

  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_watcher
    command: ["python", "-m", "src.sentinellog.realtime.watcher"]
    environment:
      SENTINEL_LOG_DIR: /app/logs
      SENTINEL_RULES_FILE: /app/src/sentinellog/rules/rules.yaml
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./logs:/app/logs
    depends_on:
      - kafka
      - redis
    restart: unless-stopped

  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_analytics
    command: ["python", "-m", "src.sentinellog.analytics.engine"]
    environment:
      DATABASE_URL: postgresql://sentinel:password@db:5432/sentinel
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: sentinel_db
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: sentinel_zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: sentinel_kafka
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: