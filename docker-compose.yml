version: "3.9"

services:
  # Main API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinellog_api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SENTINEL_LOG_DIR: /app/logs
      SENTINEL_RULES_FILE: /app/src/sentinellog/rules/rules.yaml
    volumes:
      - ./logs:/app/logs
      - ./src/sentinellog/rules:/app/src/sentinellog/rules
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Optional: PostgreSQL for future persistence (commented out)
  # db:
  #   image: postgres:15-alpine
  #   container_name: sentinellog_db
  #   environment:
  #     POSTGRES_USER: sentinel
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
  #     POSTGRES_DB: sentinel
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

  # Optional: Redis for caching/sessions (commented out)
  # redis:
  #   image: redis:7-alpine
  #   container_name: sentinellog_redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

# Volumes for persistence
volumes:
  postgres_data:

# Network definition
networks:
  default:
    name: sentinellog_network
